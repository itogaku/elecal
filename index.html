<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>さんすうプリント工房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 左に条件パネル、右にA4プリントの実寸プレビュー。紙は常に白、まわりの画面だけテーマに追従 */
:root{
  --bg:#eef1ec; --surface:#ffffff; --fg:#1f2a24; --muted:#5b6a61; --line:#d3dad4;
  --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#e1ece5; --red:#c8322a;
  --paper:#ffffff; --ink:#1b1b1b; --ink-soft:#555; --paper-line:#bdbdbd; --paper-tint:#eef4f0; --paper-red:#d2372b;
  --f-display:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131915; --surface:#1c241f; --fg:#e4ebe6; --muted:#9caaa1; --line:#2e3a33;
  --accent:#73b894; --accent-ink:#0e1a13; --accent-soft:#233229; --red:#ff7b6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131915; --surface:#1c241f; --fg:#e4ebe6; --muted:#9caaa1; --line:#2e3a33;
  --accent:#73b894; --accent-ink:#0e1a13; --accent-soft:#233229; --red:#ff7b6f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6;margin:0}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}

/* ---- panel ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width:860px){.panel{position:static}}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;letter-spacing:.02em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.field{display:flex;flex-direction:column;gap:8px}
.field>.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.grades button{font:inherit;padding:6px 0;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.grades button:hover{background:var(--accent-soft)}
.grades button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.grades button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chap.puzzle{border-top:1px dashed var(--line);padding-top:8px}
.chap-name .tag{font-weight:400}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:8px 6px;text-align:center;cursor:pointer;font-size:13px}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-3px}
.hint{font-size:12px;color:var(--muted);margin:0}
.units{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding-right:4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:10px}
@media (max-width:860px){.units{max-height:none}}
.chap>.chap-name{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chap-toggle{margin-left:auto;font:inherit;font-size:11px;font-weight:400;color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:999px;padding:1px 8px;cursor:pointer}
.chap-toggle:hover{background:var(--accent-soft)}
.unit-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sel-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.unit-tools{display:flex;flex-wrap:wrap;gap:6px}
.mini{font:inherit;font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.mini:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.mini:disabled{opacity:.45;cursor:default}
.mini.undo{border-color:var(--accent);color:var(--accent);font-weight:700}
.chap-toggle:focus-visible,.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grades button .gc{display:block;font-size:10px;line-height:1;opacity:.8;min-height:10px}
.unit{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:8px;cursor:pointer}
.unit:hover{background:var(--accent-soft)}
.unit input{margin-top:4px;accent-color:var(--accent)}
.unit .tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:4px;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type="number"]{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input[type="number"]{width:110px;font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check input{accent-color:var(--accent)}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 14px;border:1px solid var(--accent);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-direction:column;gap:8px}
.note{font-size:12px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:0}

/* ---- preview ---- */
.preview{min-width:0;display:flex;flex-direction:column;gap:12px}
.preview-bar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.preview-bar h2{font-family:var(--f-display);font-size:16px;margin:0}
.preview-bar span{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.stack-wrap{min-width:0;overflow:hidden}
.stack{display:flex;flex-direction:column;gap:20px;width:210mm;transform-origin:top left}

/* ---- paper (A4) ---- */
.sheet{width:210mm;min-height:297mm;background:var(--paper);color:var(--ink);padding:13mm 14mm 11mm;display:flex;flex-direction:column;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);font-family:var(--f-body);font-size:11pt;line-height:1.5;position:relative}
.sh-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4mm;align-items:end;border-bottom:.6mm solid var(--ink);padding-bottom:3mm}
.sh-ch{display:inline-block;font-size:8.5pt;font-weight:700;border:.3mm solid var(--ink);border-radius:99px;padding:.2mm 3mm;margin-bottom:1.5mm}
.sh-title{font-family:var(--f-display);font-weight:700;font-size:19pt;margin:0;line-height:1.25;letter-spacing:.03em}
.sh-title .cont{font-size:11pt;font-weight:500;margin-left:2mm}
.sh-title .ans-mark{color:var(--paper-red);font-size:12pt;border:.4mm solid var(--paper-red);border-radius:2mm;padding:.3mm 2.4mm;margin-left:3mm;vertical-align:middle}
.sh-meta{display:flex;gap:2mm;font-size:9pt}
.sh-meta .box{border:.3mm solid var(--ink);border-radius:1.5mm;padding:1mm 2.5mm;min-height:11mm;display:flex;flex-direction:column;justify-content:space-between}
.sh-meta .box small{font-size:7.5pt;color:var(--ink-soft)}
.sh-meta .date{width:24mm}.sh-meta .name{width:46mm}.sh-meta .score{width:24mm;text-align:right}
.sh-meta .score b{font-size:8pt;font-weight:400}
.sh-body{flex:1;display:flex;flex-direction:column;gap:5mm;padding-top:4mm}
.sh-foot{display:flex;justify-content:space-between;font-size:7.5pt;color:var(--ink-soft);border-top:.2mm solid var(--paper-line);padding-top:1.5mm;margin-top:4mm;font-variant-numeric:tabular-nums}
.lead{margin:0;font-weight:700;font-size:10.5pt}
.sec{display:flex;flex-direction:column;gap:3mm;break-inside:avoid}
.sec-head{display:flex;align-items:center;gap:2.5mm}
.sec-no{display:inline-grid;place-items:center;width:7mm;height:7mm;background:var(--ink);color:var(--paper);border-radius:1.5mm;font-weight:700;font-size:11pt;flex:none}
.sec-pts{margin-left:auto;font-size:8.5pt;color:var(--ink-soft);white-space:nowrap}
.probs{list-style:none;margin:0;padding:0;display:grid;column-gap:8mm;row-gap:0}
.probs.c1{grid-template-columns:1fr}.probs.c2{grid-template-columns:1fr 1fr}.probs.c3{grid-template-columns:1fr 1fr 1fr}
.p{display:flex;gap:2mm;align-items:flex-start;break-inside:avoid;padding:2.4mm 0}
.p .no{font-size:9.5pt;flex:none;min-width:7mm;padding-top:.6mm;color:var(--ink-soft)}
.p .body{min-width:0;flex:1}
.k-calc .p{min-height:19mm;align-items:center;border-bottom:.2mm dotted var(--paper-line)}
.k-calc .p .no{padding-top:0}
.k-calc .q{font-size:13pt;display:inline-flex;align-items:center;flex-wrap:wrap;gap:.6mm}
.k-word .p,.k-table .p,.k-data .p{border-bottom:.2mm dotted var(--paper-line);padding-block:3mm}
.wq{font-size:10.5pt;line-height:1.75}
.answer-lines{display:flex;flex-direction:column;gap:2mm;margin-top:3mm}
.answer-lines .ln{display:flex;align-items:flex-end;gap:2mm;min-height:9mm}
.answer-lines .ln span{font-size:9pt;color:var(--ink-soft);white-space:nowrap}
.answer-lines .ln i{flex:1;border-bottom:.3mm solid var(--ink-soft)}
.answer-lines .ln.short{justify-content:flex-end}.answer-lines .ln.short i{flex:none;width:45mm}
.work{min-height:14mm}
.blank{display:inline-block;min-width:16mm;height:9mm;border:.35mm solid var(--ink);border-radius:1mm;vertical-align:middle;margin:0 1mm}
.frac .blank{min-width:7mm;height:6.5mm;margin:.4mm .6mm}
.frac .calc-ans{margin:0 .5mm}
.guide-q{display:flex;align-items:center;flex-wrap:wrap;gap:1.2mm;font-size:13pt;line-height:2}
.ans{color:var(--paper-red);font-weight:700}
.calc-ans{color:var(--paper-red);font-weight:700;margin-left:1.5mm;display:inline-flex;align-items:center;gap:1mm}
.alt{font-size:.8em;font-weight:400;display:inline-flex;align-items:center}
.ans-block{color:var(--paper-red);font-size:10pt;margin-top:2mm;line-height:1.8}
.ans-block b{font-weight:700}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:middle;line-height:1.12;margin:0 .1em;font-size:.9em}
.frac>.n{border-bottom:.3mm solid currentColor;padding:0 .18em}
.frac>.d{padding:0 .18em}
.mixed{display:inline-flex;align-items:center}
.var{font-family:"Times New Roman",Times,serif;font-size:1.12em;padding:0 .04em}
.k-fig .probs{row-gap:2mm}
.k-fig .p{flex-direction:column;align-items:stretch;gap:1mm;padding-block:2mm}
.k-fig .p .no{padding-top:0}
.fig svg{width:100%;height:auto;display:block}
.sheet svg text{paint-order:stroke fill;stroke:#fff;stroke-width:1px;stroke-linejoin:round}
.figcap{font-size:10pt}
.tbl{border-collapse:collapse;margin:2mm 0;font-variant-numeric:tabular-nums;font-size:10pt}
.tbl th,.tbl td{border:.3mm solid var(--ink);padding:1mm 2.4mm;text-align:center;min-width:11mm;height:8mm}
.tbl th{background:var(--paper-tint);font-weight:700;white-space:nowrap}
.tbl td.r{color:var(--paper-red);font-weight:700}
.datalist{border:.3mm solid var(--ink);border-radius:1.5mm;padding:2mm 3mm;margin:2mm 0;font-variant-numeric:tabular-nums;letter-spacing:.06em;display:flex;flex-wrap:wrap;gap:1mm 4mm}

/* 解き方・解説 */
.steps{list-style:none;margin:1.2mm 0 0;padding:0;display:flex;flex-direction:column;gap:.8mm;font-size:9pt;line-height:1.55;color:var(--ink-soft);font-weight:400}
.steps li{display:block;position:relative;padding-left:3mm}
.steps li::before{content:"";position:absolute;left:0;top:.62em;width:1.4mm;height:1.4mm;border-radius:50%;background:var(--paper-line)}
.k-calc .p.has-steps{align-items:flex-start}
.k-calc .p.has-steps .no{padding-top:1mm}
.sh-title .ex-mark{color:var(--ink);font-size:12pt;border:.4mm solid var(--ink);background:var(--paper-tint);border-radius:2mm;padding:.3mm 2.4mm;margin-left:3mm;vertical-align:middle}
.k-ex .probs{row-gap:4mm}
.k-ex .p{padding:0;display:block}
.ex-h{display:flex;align-items:center;gap:2mm;font-family:var(--f-display);font-weight:700;font-size:12pt;margin:0 0 2mm}
.ex-h .badge{background:var(--ink);color:var(--paper);border-radius:1.5mm;padding:.2mm 2.4mm;font-size:10pt}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.pt{background:var(--paper-tint);border-radius:2mm;padding:3mm 3.5mm;font-size:10pt;line-height:1.7}
.pt.wide{grid-column:1/-1}
.pt h3{margin:0 0 1mm;font-size:10.5pt;font-family:var(--f-display)}
.pt .exm{display:flex;align-items:center;flex-wrap:wrap;gap:1mm;margin-top:1.5mm;font-size:11pt}
.ex{border:.3mm solid var(--ink);border-radius:2mm;padding:3mm 4mm}
.exq{display:flex;align-items:center;flex-wrap:wrap;gap:1mm;font-size:12pt}
.ex .exq.text{font-size:10.5pt;display:block;line-height:1.75}
.ex .kangae{display:inline-block;margin-top:2.5mm;font-size:9pt;font-weight:700;border-bottom:.3mm solid var(--ink)}
.ex .steps{font-size:10pt;color:var(--ink)}
.ex .steps li::before{background:var(--ink)}
.ex .exa{margin-top:2mm;font-weight:700;display:flex;align-items:center;gap:1.5mm;flex-wrap:wrap}
.ex .exa .ans{display:inline-flex;align-items:center;gap:1mm}
.ex-fig{display:grid;grid-template-columns:1fr 1fr;gap:4mm;align-items:start}
.ex-fig .fig{max-width:62mm}
.figlabel{font-size:8.5pt;color:var(--ink-soft)}
.why{border:.4mm solid #2a6fb0;border-radius:2mm;padding:3mm 4mm;background:#f6faff}
.why-b{background:#2a6fb0!important}
.why-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:4mm;align-items:center}
.why-grid.nofig{grid-template-columns:1fr}
.why-grid .fig svg{max-height:52mm}
.why-steps{margin:0;padding-left:5mm;font-size:10pt;line-height:1.75;display:flex;flex-direction:column;gap:1mm}
.why-steps li::marker{color:#2a6fb0;font-weight:700}
.tip{border:.3mm dashed var(--ink-soft);border-radius:2mm;padding:2.5mm 3.5mm;font-size:10pt;line-height:1.7}
.tip b{font-family:var(--f-display)}
.utbl{border-collapse:collapse;font-size:9.5pt;margin-top:1.5mm}
.utbl td{border:.25mm solid var(--paper-line);padding:.6mm 2.4mm;background:var(--paper)}

@media (prefers-reduced-motion:no-preference){.sheet{transition:opacity .15s}}

@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .panel,.preview-bar{display:none!important}
  .app{display:block;padding:0;max-width:none}
  .stack-wrap{overflow:visible;height:auto!important}
  .stack{transform:none!important;gap:0;width:auto}
  .sheet{box-shadow:none;margin:0;break-after:page;width:210mm;min-height:297mm;height:297mm;overflow:hidden}
  .sheet:last-child{break-after:auto}
}
</style>

<div class="app">
  <aside class="panel" aria-label="プリントの条件">
    <div class="brand">
      <h1>さんすうプリント工房</h1>
      <p>小学1〜6年の算数と脳トレパズル。単元を選ぶと、数値がちがうプリントを何枚でも作れます。</p>
    </div>

    <div class="field">
      <span class="label">学年</span>
      <div class="grades" role="group" aria-label="学年">
        <button type="button" disabled title="準備中">1年</button>
        <button type="button" disabled title="準備中">2年</button>
        <button type="button" disabled title="準備中">3年</button>
        <button type="button" disabled title="準備中">4年</button>
        <button type="button" disabled title="準備中">5年</button>
        <button type="button" aria-pressed="true">6年</button>
      </div>
    </div>

    <div class="field">
      <span class="label">作り方</span>
      <div class="seg">
        <input type="radio" name="mode" id="mode-unit" value="unit" checked><label for="mode-unit">単元ごと</label>
        <input type="radio" name="mode" id="mode-test" value="test"><label for="mode-test">まとめテスト</label>
      </div>
      <p class="hint" id="mode-hint">選んだ単元を1枚ずつプリントにします。</p>
    </div>

    <div class="field">
      <div class="unit-head"><span class="label">単元</span><span class="sel-count" id="sel-count" aria-live="polite"></span></div>
      <div class="unit-tools">
        <button type="button" class="mini" id="clear-grade">この学年の選択をリセット</button>
        <button type="button" class="mini" id="clear-all">全学年をリセット</button>
        <button type="button" class="mini undo" id="undo-reset" hidden>元に戻す</button>
      </div>
      <div class="units" id="units"></div>
    </div>

    <div class="field">
      <span class="label">オプション</span>
      <div class="row">
        <label for="amount">問題の量</label>
        <select id="amount">
          <option value="0.5">少なめ（半分）</option>
          <option value="1">1枚分</option>
          <option value="2" selected>2枚分</option>
          <option value="3">3枚分</option>
          <option value="5">5枚分</option>
        </select>
      </div>
      <p class="hint">1単元あたりの量です。図の問題もこの量だけふえます。</p>
      <div class="row">
        <label for="sets">セット数</label>
        <select id="sets">
          <option value="1" selected>1セット</option>
          <option value="2">2セット</option>
          <option value="3">3セット</option>
          <option value="5">5セット</option>
          <option value="10">10セット</option>
        </select>
      </div>
      <p class="hint">数字のちがうプリントを、まとめて何回分も作れます（問題番号が1つずつずれます）。</p>
      <label class="check"><input type="checkbox" id="with-explain" checked> 解説ページをつける（ポイントと例題）</label>
      <label class="check"><input type="checkbox" id="with-answers" checked> 答えのページをつける</label>
      <label class="check"><input type="checkbox" id="with-steps" checked> 答えに解き方をのせる</label>
      <label class="check"><input type="checkbox" id="with-name" checked> 日付・名前の欄をつける</label>
      <div class="row">
        <label for="seed">問題番号</label>
        <input type="number" id="seed" min="1" max="99999" value="1024">
      </div>
      <p class="hint">数字は毎回ランダムに作られ、問題番号は1〜99999まであります。同じ番号を入れると同じ問題をもう一度出せます。</p>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="reroll">数字を変えて作り直す</button>
      <!--PRINT--><button type="button" class="btn ghost" id="print">印刷する</button><!--/PRINT-->
      <!--PREVIEW_NOTE-->
    </div>
  </aside>

  <main class="preview">
    <div class="preview-bar">
      <h2>プレビュー</h2>
      <span id="count"></span>
    </div>
    <div class="stack-wrap" id="stack-wrap"><div class="stack" id="stack"></div></div>
  </main>
</div>

<script>
"use strict";
/* ============ 乱数・数のユーティリティ ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=Math.random;
const ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
const pick=a=>a[Math.floor(rng()*a.length)];
const chance=p=>rng()<p;
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const num=x=>String(+(+x).toFixed(6));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

class Fr{
  constructor(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;this.n=n/g;this.d=d/g}
  mul(o){return new Fr(this.n*o.n,this.d*o.d)}
  div(o){return new Fr(this.n*o.d,this.d*o.n)}
  add(o){return new Fr(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){return new Fr(this.n*o.d-o.n*this.d,this.d*o.d)}
  inv(){return new Fr(this.d,this.n)}
}
const F=(n,d)=>`<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const M=(w,n,d)=>`<span class="mixed">${w}${F(n,d)}</span>`;
/** 答えの表示：整数ならそのまま、仮分数なら帯分数も添える */
function A(f){
  if(f.d===1)return String(f.n);
  if(f.n>f.d)return `${F(f.n,f.d)}<span class="alt">（${M(Math.floor(f.n/f.d),f.n%f.d,f.d)}）</span>`;
  return F(f.n,f.d);
}
const FH=f=>f.d===1?String(f.n):F(f.n,f.d);
const X='<i class="var">x</i>',Y='<i class="var">y</i>';
const why=s=>`<span>${s}</span>`;
function proper(dmin=2,dmax=9){for(;;){const d=ri(dmin,dmax),n=ri(1,d-1);if(gcd(n,d)===1)return new Fr(n,d)}}
function improper(dmax=7){for(;;){const d=ri(2,dmax),n=ri(d+1,2*d-1);if(gcd(n,d)===1)return new Fr(n,d)}}
/* 式の「項」：f=値、h=表示、k=種類（frac / mixed / dec / int） */
const tFrac=f=>({f,h:FH(f),k:f.d===1?'int':'frac'});
const tInt=n=>({f:new Fr(n),h:String(n),k:'int'});
function tMixed(){const w=ri(1,3),p=proper(2,7);return{f:new Fr(w*p.d+p.n,p.d),h:M(w,p.n,p.d),k:'mixed'}}
function tDec(){for(;;){const i=ri(1,24);if(i%10)return{f:new Fr(i,10),h:num(i/10),k:'dec',i}}}

/** 約分のステップ */
function reduceStep(rn,rd){const g=gcd(rn,rd);if(g>1)return[`分子と分母を ${g} でわって約分する → ${A(new Fr(rn,rd))}`];
  if(rd!==1&&rn>rd)return[`帯分数になおすと ${M(Math.floor(rn/rd),rn%rd,rd)}`];return[]}
/** 分数のかけ算を1本の式にまとめて計算するステップ */
function mulSteps(fs){
  const ns=fs.map(f=>f.n),ds=fs.map(f=>f.d);
  const rn=ns.reduce((a,b)=>a*b,1),rd=ds.reduce((a,b)=>a*b,1);
  const sn=ns.filter(x=>x!==1),sd=ds.filter(x=>x!==1);
  const raw=rd===1?String(rn):F(rn,rd);
  const out=[];
  if(sn.length>1||sd.length>1){const top=sn.length?sn.join(' × '):'1';out.push(`分子どうし、分母どうしをかける：${sd.length?F(top,sd.join(' × ')):top} = ${raw}`)}
  else out.push(`分子どうし、分母どうしをかける → ${raw}`);
  return out.concat(reduceStep(rn,rd));
}
/** 項と演算子の列 → 解き方（仮分数・分数になおす → 逆数 → かけ算） */
function chainSteps(terms,ops){
  const st=[];
  terms.forEach(t=>{
    if(t.k==='mixed')st.push(`帯分数を仮分数になおす：${t.h} = ${F(t.f.n,t.f.d)}`);
    if(t.k==='dec')st.push(`小数を分数になおす：${t.h} = ${F(t.i,10)}${t.f.d!==10?` = ${FH(t.f)}`:''}`);
  });
  const fs=terms.map((t,i)=>i>0&&ops[i-1]==='÷'?t.f.inv():t.f);
  if(ops.includes('÷')){
    const expr=terms.map((t,i)=>(i?' × ':'')+FH(fs[i])).join('');
    st.push(`わる数を逆数にして、かけ算にする：${expr}`);
  }
  return st.concat(mulSteps(fs));
}
const exprOf=(terms,ops)=>terms.map((t,i)=>(i?`<span>${ops[i-1]}</span>`:'')+t.h).join('');
function calcProblem(terms,ops){
  const fs=terms.map((t,i)=>i>0&&ops[i-1]==='÷'?t.f.inv():t.f);
  const r=fs.reduce((a,b)=>a.mul(b),new Fr(1));
  return{q:exprOf(terms,ops),a:A(r),steps:chainSteps(terms,ops)};
}

const PLACE=['一','十','百','千','一万','十万'];
function colAddSteps(a,b){
  const da=String(a).split('').reverse(),db=String(b).split('').reverse(),L=Math.max(da.length,db.length),st=[];let c=0;
  for(let i=0;i<L;i++){const x=+(da[i]||0),y=+(db[i]||0),s=x+y+c;
    st.push(`${PLACE[i]}の位：${x} + ${y}${c?' + 1（くり上がり）':''} = ${s}${s>=10?` → ${s%10} を書いて、1 くり上がる`:''}`);c=s>=10?1:0}
  if(c)st.push(`${PLACE[L]}の位に 1 を書く`);
  return st;
}
function colSubSteps(a,b){
  const da=String(a).split('').reverse(),db=String(b).split('').reverse(),st=[];let br=0;
  for(let i=0;i<da.length;i++){const o=+da[i],y=+(db[i]||0),e=o-br;
    if(i>=db.length&&br===0){continue}
    if(e<0){st.push(`${PLACE[i]}の位：0 から 1 かしたいので、上の位から 1 かりて 10 にして 1 かす → 9 − ${y} = ${9-y}`);br=1}
    else if(e<y){st.push(`${PLACE[i]}の位：${br?`1 かしたので ${e}。`:''}${e} から ${y} はひけないので、上の位から 1 かりて ${e+10} − ${y} = ${e+10-y}`);br=1}
    else{st.push(`${PLACE[i]}の位：${br?`1 かしたので ${e}。`:''}${e} − ${y} = ${e-y}`);br=0}}
  return st;
}

function clockSVG(h,m){
  let t='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?42:39;t+=`<line x1="${50+r1*Math.sin(a)}" y1="${50-r1*Math.cos(a)}" x2="${50+44*Math.sin(a)}" y2="${50-44*Math.cos(a)}" stroke="#111" stroke-width="${i%5?.5:1.2}"/>`}
  for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;t+=`<text x="${50+33*Math.sin(a)}" y="${50-33*Math.cos(a)+3.2}" font-size="9" text-anchor="middle" fill="#111">${i}</text>`}
  const ha=((h%12)+m/60)*30*Math.PI/180,ma=m*6*Math.PI/180;
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#111" stroke-width="1.6"/>${t}

  <line x1="50" y1="50" x2="${50+36*Math.sin(ma)}" y2="${50-36*Math.cos(ma)}" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><circle cx="50" cy="50" r="2.2" fill="#111"/></svg>`;
}

function axes(xmax,ymax,s,ox,oy,ystep,xl,yl,xtick=1,ytick=1){
  let t=gl(xmax,ymax,s,ox,oy-ymax*s);
  t+=`<line x1="${ox}" y1="${oy}" x2="${num(ox+xmax*s+3)}" y2="${oy}" stroke="#111" stroke-width=".8"/><line x1="${ox}" y1="${oy}" x2="${ox}" y2="${num(oy-ymax*s-3)}" stroke="#111" stroke-width=".8"/>`;
  for(let i=0;i<=xmax;i+=xtick)t+=T(ox+i*s,oy+4.5,i,3.4);
  for(let j=ytick;j<=ymax;j+=ytick)t+=T(ox-1.5,oy-j*s+1.2,num(j*ystep),3.4,'end');
  t+=T(ox+xmax*s+4,oy+1,xl,3.6,'start')+T(ox,oy-ymax*s-5,yl,3.6);return t}

/** 筆算（たてがき）の図。op: '+', '−', '×'。答えの行は方眼になる */
function hissanFig(a,b,op,show){
  const A=String(a),B=String(b);let res=op==='+'?a+b:op==='−'?a-b:a*b;const R=String(res);
  const parts=op==='×'&&b>=10?[...B].reverse().map((d,i)=>String(a*+d)+'_'.repeat(i)):[];
  const W=Math.max(A.length,B.length+1,R.length,...parts.map(p=>p.length))+0;const cw=11,ox=4,top=4;
  const cellX=i=>ox+(W-1-i)*cw; // i: 右からの位置
  let t='',y=top;const rowText=(s,yy,col)=>{[...s].reverse().forEach((ch,i)=>{if(ch!=='_')t+=`<text x="${num(cellX(i)+cw/2)}" y="${num(yy+cw*.78)}" font-size="${num(cw*.78)}" text-anchor="middle" fill="${col||'#111'}" ${col?'font-weight="700"':''}>${ch}</text>`})};
  const grid=(yy)=>{for(let i=0;i<W;i++)t+=`<rect x="${num(cellX(i)+.6)}" y="${num(yy+.6)}" width="${cw-1.2}" height="${cw-1.2}" fill="none" stroke="#bbb" stroke-width=".5" stroke-dasharray="1.5 1"/>`};
  rowText(A,y);y+=cw+2;rowText(B,y);t+=`<text x="${ox-1}" y="${num(y+cw*.78)}" font-size="${num(cw*.75)}" fill="#111">${op}</text>`;y+=cw+2;
  t+=`<line x1="${ox-2}" y1="${y}" x2="${ox+W*cw}" y2="${y}" stroke="#111" stroke-width="1.1"/>`;y+=2;
  if(parts.length){parts.forEach(p=>{show?rowText(p,y,RED):grid(y);y+=cw+1});t+=`<line x1="${ox-2}" y1="${y}" x2="${ox+W*cw}" y2="${y}" stroke="#111" stroke-width="1.1"/>`;y+=2}
  show?rowText(R,y,RED):grid(y);y+=cw+3;
  return SVGW(`0 0 ${ox+W*cw+4} ${num(y)}`,t);
}

 {id:'g5-pconv',title:'小数・百分率・歩合',kind:'calc',n:12,cols:2,lead:'□にあてはまる数や言葉を書きましょう。',

   const ox=4,w=0.9;let g=`<rect x="${ox}" y="8" width="${100*w}" height="12" fill="none" stroke="#111" stroke-width=".8"/>`;for(let i=0;i<=100;i+=10)g+=`<line x1="${ox+i*w}" y1="20" x2="${ox+i*w}" y2="23" stroke="#111" stroke-width=".4"/>${T(ox+i*w,27,i,3)}`;

addUnits(5,'図形の 面積と 体積',[
 {id:'g5-polygon',title:'正多角形',kind:'fig',n:6,cols:3,lead:'円の中心のまわりの角を等分して正多角形をかきました。アの角は何度ですか。',

  gen(){const n=pick([5,6,8,9,10,12]),cx=50,cy=50,R=38;const P=Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+R*Math.cos(a),cy+R*Math.sin(a)]});

 {id:'g5-quadangle',title:'四角形の角',kind:'fig',n:6,cols:3,lead:'アの角の大きさを求めましょう。',

  gen(){let a;do{a=[ri(14,26)*5,ri(14,26)*5,ri(14,26)*5]}while(360-a[0]-a[1]-a[2]<50||360-a[0]-a[1]-a[2]>140);const d=360-a[0]-a[1]-a[2];
   const P=[[12,80],[88,80],[80,20],[22,28]];const hide=ri(0,3),angs=[a[0],a[1],a[2],d];const ord=[...angs];[ord[hide],ord[3]]=[ord[3],ord[hide]];
   const lab=P.map((p,i)=>{const c=[50,52],dx=c[0]-p[0],dy=c[1]-p[1],L=Math.hypot(dx,dy);return T(p[0]+dx/L*11,p[1]+dy/L*11+1.5,i===hide?'ア':ord[i]+'°',4.5)}).join('');

 {id:'g5-volcombo',title:'組み合わせた立体の体積',kind:'fig',n:4,cols:2,lead:'つぎの立体の体積を求めましょう。',

  gen(){const W=ri(6,10),H=ri(6,10),w=ri(2,W-3),h=ri(2,H-3),D=ri(3,8);const s=5.2,dx=D*s*.5,dy=D*s*.4,ox=8,oy=10+dy;
   const fr=[[0,0],[W-w,0],[W-w,h],[W,h],[W,H],[0,H]].map(p=>[ox+p[0]*s,oy+p[1]*s]);const bk=fr.map(p=>[p[0]+dx,p[1]-dy]);
   let g='';[[0,1],[1,2],[2,3],[3,4]].forEach(([i,j])=>{g+=`<polygon points="${num(fr[i][0])},${num(fr[i][1])} ${num(fr[j][0])},${num(fr[j][1])} ${num(bk[j][0])},${num(bk[j][1])} ${num(bk[i][0])},${num(bk[i][1])}" fill="#dcdcdc" stroke="#111" stroke-width=".7"/>`});

   const v=(W*H-w*h)*D;return{q:`<div class="fig" style="max-width:60mm">${SVGW(`0 0 ${num(ox+W*s+dx+14)} ${num(oy+H*s+10)}`,g)}</div>`,a:`<b>${v} cm³</b>`,steps:[`大きい直方体 ${W} × ${H} × ${D} = ${W*H*D}`,`欠けた部分 ${w} × ${h} × ${D} = ${w*h*D}`,`${W*H*D} − ${w*h*D} = ${v}`]}}},

add6('分数のかけ算・わり算',[
 {id:'frac-guide',title:'□をうめて計算（分数のかけ算・わり算）',kind:'calc',n:8,cols:1,lead:'□にあてはまる数を書いて、計算のしかたをなぞりましょう。',

  gen(){const t=ri(0,3);

   if(t===1){const a=proper(),k=ri(2,9),rd=a.d*k,r=new Fr(a.n,rd);return{q:`<span class="guide-q">${FH(a)} ÷ ${k} = ${F(a.n,`${a.d} × ${B_}`)} = ${F(a.n,B_)}${r.d!==rd?` = ${B_}`:''}</span>`,tail:'',blanks:[k,rd,...(r.d!==rd?[A(r)]:[])],a:A(r),steps:['分子はそのまま、分母に整数をかける',...reduceStep(a.n,rd)]}}
   const a=proper(),b=proper();
   if(t===2){const rn=a.n*b.n,rd=a.d*b.d,r=new Fr(rn,rd);return{q:`<span class="guide-q">${FH(a)} × ${FH(b)} = ${F(`${a.n} × ${B_}`,`${a.d} × ${B_}`)} = ${F(B_,B_)}${r.n!==rn?` = ${B_}`:''}</span>`,tail:'',blanks:[b.n,b.d,rn,rd,...(r.n!==rn?[A(r)]:[])],a:A(r),steps:['分子どうし、分母どうしをかける',...reduceStep(rn,rd)]}}
   const rn=a.n*b.d,rd=a.d*b.n,r=new Fr(rn,rd);return{q:`<span class="guide-q">${FH(a)} ÷ ${FH(b)} = ${FH(a)} × ${F(B_,B_)} = ${F(`${a.n} × ${b.d}`,`${a.d} × ${b.n}`)} = ${B_}</span>`,tail:'',blanks:[b.d,b.n,A(r)],a:A(r),steps:['わる数の逆数をかける',...reduceStep(rn,rd)]}}},

/* ---------- およその面積（方眼を数える） ---------- */
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const [xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
add6('いろいろな面積',[
 {id:'approx-grid',title:'方眼を数えておよその面積',kind:'fig',n:2,cols:2,lead:'方眼を数えて、図形のおよその面積を求めましょう。',
  explain:{points:[{h:'数え方',b:'図形の中に全部入っている方眼は1こ、線にかかっている方眼は半分（0.5こ）と考えて数えます。'},{h:'計算',b:'およその面積 ＝ 全部入っている数 ＋ 線にかかっている数 ÷ 2'}],tip:'<b>こつ</b>　数えた方眼に印をつけながら数えると、数えまちがいが少なくなります。'},
  gen(){const W=10,H=10,R=3.6+rng()*.6,p1=rng()*6,p2=rng()*6,a1=.12+rng()*.1,a2=.08+rng()*.08,cx=5,cy=5;
   const P=Array.from({length:360},(_,i)=>{const t=i*Math.PI/180,r=R*(1+a1*Math.sin(2*t+p1)+a2*Math.sin(3*t+p2));return[cx+r*Math.cos(t),cy+r*Math.sin(t)]});
   let full=0,part=0;const marks=[];
   for(let i=0;i<W;i++)for(let j=0;j<H;j++){const cs=[[i,j],[i+1,j],[i,j+1],[i+1,j+1]].map(([x,y])=>inPoly(x,y,P)),vin=P.some(([x,y])=>x>i&&x<i+1&&y>j&&y<j+1);
     if(cs.every(Boolean)&&!vin){full++;marks.push([i,j,'f'])}else if(cs.some(Boolean)||vin){part++;marks.push([i,j,'p'])}}
   const s=9,o=4,unit=pick(['cm','km']);const shape=`<polygon points="${P.map(([x,y])=>`${num(o+x*s)},${num(o+y*s)}`).join(' ')}" fill="${CB}" fill-opacity=".55" stroke="#111" stroke-width=".8"/>`;
   const mk=marks.map(([i,j,k])=>k==='f'?`<circle cx="${o+i*s+s/2}" cy="${o+j*s+s/2}" r="1.3" fill="#c0392b"/>`:`<path d="M${o+i*s+2},${o+j*s+s-2} L${o+i*s+s-2},${o+j*s+2}" stroke="#2a6fb0" stroke-width=".6"/>`).join('');
   const base=gl(W,H,s,o,o)+shape;const v=num(full+part/2);
   return{q:`<div class="fig">${SVGW('0 0 98 98',base)}</div><div class="figcap">方眼1目もりは 1${unit}。(1) 全部入っている方眼　(2) 線にかかっている方眼　(3) およその面積</div>`,a:`<div class="fig">${SVGW('0 0 98 98',base+mk)}</div><div class="ans-block">(1) <b>${full}こ</b>（●）　(2) <b>${part}こ</b>（／）　(3) <b>約 ${v}${unit}²</b><br><span style="font-size:8.5pt">※ 線にかかっているかどうかの見方で、数が少しちがってもかまいません。</span></div>`,figAns:true,
     steps:[`全部入っている方眼 ${full}こ、線にかかっている方眼 ${part}こ`,`${full} + ${part} ÷ 2 = ${v}`]}}},
]);

const G=10;
function gridSVG(inner){
  let g='';for(let i=0;i<=G;i++){g+=`<line x1="${i*10}" y1="0" x2="${i*10}" y2="${G*10}"/><line x1="0" y1="${i*10}" x2="${G*10}" y2="${i*10}"/>`}
  return `<svg viewBox="-6 -8 112 116" xmlns="http://www.w3.org/2000/svg" role="img"><g stroke="#c4c4c4" stroke-width=".5" fill="none">${g}</g>${inner}</svg>`;
}
const P=pts=>pts.map(p=>`${p[0]*10},${p[1]*10}`).join(' ');
function genLineSym(){
  for(let tries=0;tries<200;tries++){
    const side=chance(.5)?-1:1,top=ri(1,3),bot=ri(7,9),k=ri(3,5);
    const angs=Array.from({length:k},()=>ri(20,160)).sort((a,b)=>a-b);
    const pts=[[5,top]];let ok=true;
    for(const a of angs){const r=ri(2,5),rad=a*Math.PI/180;const x=5+side*Math.round(r*Math.sin(rad)),y=5-Math.round(r*Math.cos(rad));
      if(Math.abs(x-5)<1||x<0||x>10||y<0||y>10){ok=false;break}
      const l=pts[pts.length-1];if(l[0]===x&&l[1]===y)continue;pts.push([x,y])}
    if(!ok||pts.length<4)continue;
    pts.push([5,bot]);
    const mir=pts.map(p=>[10-p[0],p[1]]);
    const axis=`<line x1="50" y1="-4" x2="50" y2="104" stroke="#222" stroke-width="1" stroke-dasharray="6 2 1.5 2"/><text x="54" y="-1.5" font-size="7" fill="#222">ア</text><text x="54" y="107" font-size="7" fill="#222">イ</text>`;
    const half=`<polyline points="${P(pts)}" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>`;
    const ansl=`<polyline points="${P(mir)}" fill="none" stroke="#d2372b" stroke-width="1.8" stroke-linejoin="round"/>`;
    const v=pts[1],d=Math.abs(v[0]-5);
    return{q:`<div class="fig">${gridSVG(axis+half)}</div>`,a:`<div class="fig">${gridSVG(axis+half+ansl)}</div>`,figAns:true,
      steps:[`たとえば上から2番目の頂点は、軸から${side<0?'左':'右'}に ${d} ます → 軸の${side<0?'右':'左'}に ${d} ますのところに点をとる`,'ほかの頂点も同じようにして、とった点を順に結ぶ']};
  }
}
function genPointSym(){
  for(let tries=0;tries<200;tries++){
    const dx=ri(1,4)*(chance(.5)?1:-1),dy=ri(1,4)*(chance(.5)?1:-1);
    const a0=Math.atan2(dy,dx),k=ri(2,4);
    const ts=Array.from({length:k},()=>0.12+rng()*0.76).sort((a,b)=>a-b);
    const off=[[dx,dy]];let ok=true;
    for(const t of ts){const r=ri(2,5),an=a0+t*Math.PI;const ox=Math.round(r*Math.cos(an)),oy=Math.round(r*Math.sin(an));
      if((ox===0&&oy===0)||Math.abs(ox)>5||Math.abs(oy)>5){ok=false;break}
      const l=off[off.length-1];if(l[0]===ox&&l[1]===oy)continue;off.push([ox,oy])}
    if(!ok||off.length<3)continue;
    off.push([-dx,-dy]);
    const toG=o=>[5+o[0],5-o[1]];
    const half=off.map(toG),rot=off.map(o=>toG([-o[0],-o[1]]));
    const center=`<circle cx="50" cy="50" r="1.8" fill="#111"/><text x="53" y="47" font-size="7" fill="#111">O</text>`;
    const h=`<polyline points="${P(half)}" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>`;
    const r=`<polyline points="${P(rot)}" fill="none" stroke="#d2372b" stroke-width="1.8" stroke-linejoin="round"/>`;
    const v=off[1],hz=v[0]>0?'右':'左',vt=v[1]>0?'上':'下',hz2=v[0]>0?'左':'右',vt2=v[1]>0?'下':'上';
    const desc=(a,b,ha,va)=>[a?`${ha}に ${Math.abs(a)} ます`:'',b?`${va}に ${Math.abs(b)} ます`:''].filter(Boolean).join('、');
    return{q:`<div class="fig">${gridSVG(center+h)}</div>`,a:`<div class="fig">${gridSVG(center+h+r)}</div>`,figAns:true,
      steps:[`たとえば2番目の頂点は、Oから${desc(v[0],v[1],hz,vt)} → Oから${desc(v[0],v[1],hz2,vt2)}のところに点をとる`,'ほかの頂点も同じようにして、とった点を順に結ぶ']};
  }
}
function genCircle(){
  const t=pick(['r','r','d','d','half','half','quarter','quarter','circ']);
  const Sv=(inner)=>`<svg viewBox="0 0 100 92" xmlns="http://www.w3.org/2000/svg" role="img">${inner}</svg>`;
  const fill='fill="#e9e9e9" stroke="#111" stroke-width="1.4"';
  const lab=(x,y,s)=>`<text x="${x}" y="${y}" font-size="8.5" text-anchor="middle" fill="#111">${s}</text>`;
  const area=r=>num(r*r*3.14);
  if(t==='r'){const r=ri(2,10);return{q:`<div class="fig">${Sv(`<circle cx="50" cy="46" r="38" ${fill}/><line x1="50" y1="46" x2="88" y2="46" stroke="#111" stroke-width="1.2"/><circle cx="50" cy="46" r="1.6" fill="#111"/>${lab(69,42,r+'cm')}`)}</div>`,a:`<b>${area(r)} cm²</b>`,steps:[`半径 × 半径 × 3.14：${r} × ${r} × 3.14 = ${area(r)}`]}}
  if(t==='d'){const d=ri(2,10)*2,r=d/2;return{q:`<div class="fig">${Sv(`<circle cx="50" cy="46" r="38" ${fill}/><line x1="12" y1="46" x2="88" y2="46" stroke="#111" stroke-width="1.2"/>${lab(50,42,d+'cm')}`)}</div>`,a:`<b>${area(r)} cm²</b>`,steps:[`直径が ${d} cm なので、半径は ${d} ÷ 2 = ${r} cm`,`${r} × ${r} × 3.14 = ${area(r)}`]}}
  if(t==='half'){const r=ri(2,10);const v=num(r*r*314/200);return{q:`<div class="fig">${Sv(`<path d="M10,66 A40,40 0 0 1 90,66 Z" ${fill}/><line x1="50" y1="66" x2="90" y2="66" stroke="#111" stroke-width="1.2"/>${lab(70,78,r+'cm')}`)}</div><div class="figcap">（半円）</div>`,a:`<b>${v} cm²</b>`,steps:[`円全体の面積：${r} × ${r} × 3.14 = ${area(r)}`,`半円なので 2 でわる：${area(r)} ÷ 2 = ${v}`]}}
  if(t==='quarter'){const r=ri(2,10);const v=num(r*r*314/400);return{q:`<div class="fig">${Sv(`<path d="M18,82 L88,82 A70,70 0 0 0 18,12 Z" ${fill}/><polyline points="18,74 26,74 26,82" fill="none" stroke="#111" stroke-width=".8"/>${lab(53,90,r+'cm')}`)}</div><div class="figcap">（円を4等分した形）</div>`,a:`<b>${v} cm²</b>`,steps:[`円全体の面積：${r} × ${r} × 3.14 = ${area(r)}`,`4等分なので 4 でわる：${area(r)} ÷ 4 = ${v}`]}}
  const r=ri(1,10);const C=num(r*2*3.14);return{q:`<div class="figcap" style="padding-top:6mm">円周の長さが ${C} cm の円</div>`,a:`<b>${area(r)} cm²</b>`,steps:[`直径 = 円周 ÷ 3.14 = ${C} ÷ 3.14 = ${2*r}`,`半径 = ${2*r} ÷ 2 = ${r}`,`${r} × ${r} × 3.14 = ${area(r)}`]};
}
function genData(){
  const c=pick([{s:'ソフトボール投げの記録',u:'m',lo:14,hi:36},{s:'1か月に読んだ本の数',u:'さつ',lo:1,hi:12},{s:'家から学校までの通学時間',u:'分',lo:4,hi:25},{s:'1週間になわとびをした日数',u:'日',lo:0,hi:7}]);
  for(let t=0;t<5000;t++){
    const n=pick([9,10,11]);const mode=ri(c.lo,c.hi);const vals=[mode,mode,mode];
    while(vals.length<n)vals.push(ri(c.lo,c.hi));
    const cnt={};vals.forEach(v=>cnt[v]=(cnt[v]||0)+1);
    if(Object.entries(cnt).some(([v,k])=>+v!==mode&&k>=3))continue;
    const sum=vals.reduce((a,b)=>a+b,0);if(sum%n)continue;
    const s=[...vals].sort((a,b)=>a-b);const med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;
    shuffle(vals);
    const medStep=n%2?`中央値：小さい順に ${s.join(', ')}　→ ${(n+1)/2} 番目の ${med}`:`中央値：小さい順に ${s.join(', ')}　→ ${n/2} 番目と ${n/2+1} 番目の平均 (${s[n/2-1]} + ${s[n/2]}) ÷ 2 = ${num(med)}`;
    return{q:`下の資料は、${n} 人の${c.s}（${c.u}）です。<div class="datalist">${vals.map(v=>`<span>${v}</span>`).join('')}</div>(1) 平均値を求めましょう。　(2) 中央値を求めましょう。　(3) 最頻値を求めましょう。`,
      parts:['(1)','(2)','(3)'],a:`(1) <b>${sum/n} ${c.u}</b>　(2) <b>${num(med)} ${c.u}</b>　(3) <b>${mode} ${c.u}</b>`,
      steps:[`平均値：合計 ${sum} ÷ 人数 ${n} = ${sum/n}`,medStep,`最頻値：${mode} が 3 回出てきて、いちばん多い`]};
  }
}

let undoSnap=null,undoTimer=null;
function snapshot(){return Object.fromEntries(Object.entries(state.sel).map(([g,s])=>[g,new Set(s)]))}
function offerUndo(snap){undoSnap=snap;const u=$('#undo-reset');u.hidden=false;clearTimeout(undoTimer);undoTimer=setTimeout(()=>{u.hidden=true;undoSnap=null},10000)}
$('#units').addEventListener('change',e=>{if(e.target.type==='checkbox'){e.target.checked?state.selected.add(e.target.value):state.selected.delete(e.target.value);refreshSel();render()}});
$('#units').addEventListener('click',e=>{const b=e.target.closest('.chap-toggle');if(!b)return;const ids=chaptersFor(state.grade)[+b.dataset.ch].items.map(u=>u.id);
  if(b.dataset.on)ids.forEach(id=>state.selected.delete(id));else ids.forEach(id=>state.selected.add(id));
  ids.forEach(id=>{const c=document.getElementById('u-'+id);if(c)c.checked=state.selected.has(id)});refreshSel();render()});
$('#clear-grade').addEventListener('click',()=>{const s=snapshot();state.selected.clear();buildUnitList();render();offerUndo(s)});
$('#clear-all').addEventListener('click',()=>{const s=snapshot();Object.values(state.sel).forEach(x=>x.clear());buildUnitList();render();offerUndo(s)});
$('#undo-reset').addEventListener('click',()=>{if(!undoSnap)return;state.sel=undoSnap;undoSnap=null;$('#undo-reset').hidden=true;buildUnitList();render()});
function makeProblems(u,count,seedKey){
  LV=u.grade||state.grade;rng=mulberry32(hashStr(u.grade+'|'+seedKey));const out=[];
  const seen=new Set();
  for(let i=0;i<count;i++){let p,t=0;do{p=u.gen.call(u)}while(seen.has(p.q)&&++t<30);seen.add(p.q);out.push(p)}
  return out;
}
/* 問題数：単元ごとの「1枚分」の数 × 選んだ枚数。図の問題も同じように増える */
function countFor(u){const c=u.cols||1;return Math.max(1,Math.round(u.n*state.amount/c)*c)}
/** {_} を空らん（または赤字の答え）にする。p.blanks があれば、□ごとに順に答えを入れる */
function fillBlanks(p,ans){let i=0;return p.q.replace(/\{_\}/g,()=>{const v=p.blanks?p.blanks[i++]:p.a;return ans?`<span class="calc-ans">${v}</span>`:'<span class="blank"></span>'})}
const stepsHTML=p=>p.steps&&p.steps.length?`<ol class="steps">${p.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`:'';
function probHTML(u,p,i,ans){
  const no=`<span class="no">(${i+1})</span>`;
  const st=ans&&state.steps?stepsHTML(p):'';
  if(u.kind==='calc'){
    const tail=p.tail===undefined?'<span>=</span>':p.tail;
    const q=p.q.includes('{_}')?fillBlanks(p,ans):`${p.q}${tail}${ans?`<span class="calc-ans">${p.a}</span>`:''}`;
    return `<li class="p${st?' has-steps':''}">${no}<div class="body"><span class="q">${q}</span>${st}</div></li>`;
  }
  if(u.kind==='fig'){
    if(ans&&p.figAns)return `<li class="p">${no}${p.a}${st}</li>`;
    const lines=ans?`<div class="ans-block">${p.a}</div>${st}`:`<div class="answer-lines"><div class="ln short"><span>答え</span><i></i></div></div>`;
    return `<li class="p">${no}${p.q}${p.figAns&&!ans?'':lines}</li>`;
  }
  const parts=p.parts||['式','答え'];
  const lines=ans?`<div class="ans-block">${p.a}</div>${st}`:
    `${parts.includes('式')?'<div class="work"></div>':''}<div class="answer-lines">${parts.map(t=>`<div class="ln ${t==='答え'?'short':''}"><span>${t}</span><i></i></div>`).join('')}</div>`;
  return `<li class="p">${no}<div class="body"><div class="wq">${p.q}</div>${lines}</div></li>`;
}
/* ---- 解説ページ ---- */
function exampleHTML(u,p,i){
  const head=`<div class="ex-h"><span class="badge">例題${i+1}</span></div>`;
  const steps=`<span class="kangae">考え方</span>${stepsHTML(p)}`;
  if(u.kind==='calc'){
    const tail=p.tail===undefined?'<span>=</span>':p.tail;
    const q=p.q.includes('{_}')?fillBlanks(p,false):`${p.q}${tail}`;
    return `<li class="p"><div class="ex">${head}<div class="exq">${q}</div>${steps}<div class="exa">答え <span class="ans">${p.blanks?fillBlanks(p,true):p.a}</span></div></div></li>`;
  }
  if(u.kind==='fig'){
    if(p.figAns)return `<li class="p"><div class="ex">${head}<div class="ex-fig"><div><div class="figlabel">問題</div>${p.q}</div><div><div class="figlabel">できあがり（赤い線）</div>${p.a}</div></div>${steps}</div></li>`;
    return `<li class="p"><div class="ex">${head}<div class="ex-fig"><div>${p.q}</div><div>${steps}<div class="exa">答え <span class="ans">${p.a}</span></div></div></div></div></li>`;
  }
  return `<li class="p"><div class="ex">${head}<div class="exq text">${p.q}</div>${steps}<div class="exa">答え <span class="ans">${p.a}</span></div></div></li>`;
}
function explainSheet(u){
  const e=u.explain||{points:[]};
  const pts=`<li class="p"><div class="ex-h">ポイント</div><div class="pts">${e.points.map(pt=>`<div class="pt${pt.wide?' wide':''}"><h3>${pt.h}</h3><div>${pt.b}</div>${pt.ex?`<div class="exm">${pt.ex}</div>`:''}</div>`).join('')}</div></li>`;
  const nEx=u.kind==='table'||u.kind==='data'||(typeof WHY!=='undefined'&&WHY[u.id])?1:2;
  const exs=makeProblems(u,nEx,`${state.seed}:ex:${u.id}`).map((p,i)=>exampleHTML(u,p,i)).join('');
  const tip=e.tip?`<li class="p"><div class="tip">${e.tip}</div></li>`:'';
  const wf=typeof WHY!=='undefined'&&WHY[u.id];
  const why=wf?wf().map(w=>`<li class="p"><div class="why"><div class="ex-h"><span class="badge why-b">なぜ？</span>${w.cap}</div><div class="why-grid${w.svg?'':' nofig'}">${w.svg?`<div class="fig">${w.svg}</div>`:''}<ol class="why-steps">${w.lines.map(l=>`<li>${l}</li>`).join('')}</ol></div></div></li>`).join(''):'';
  const body=`<div class="sec k-ex" data-uid="ex-${u.id}"><ol class="probs c1">${pts}${why}${exs}${tip}</ol></div>`;
  return sheetHTML(body,headHTML(u.chapter,u.title,'ex',false),`${u.title}（解説）`);
}
function headHTML(chapter,title,mark,test){
  const meta=state.name&&!mark?`<div class="sh-meta"><div class="box date"><small>日付</small><span>　月　　日</span></div><div class="box name"><small>名前</small><span></span></div>${test?'<div class="box score"><small>得点</small><span><b>/100点</b></span></div>':''}</div>`:'<div></div>';
  const m=mark==='ans'?'<span class="ans-mark">こたえ</span>':mark==='ex'?'<span class="ex-mark">解説</span>':'';
  return `<header class="sh-head"><div><span class="sh-ch">${chapter}</span><h2 class="sh-title">${title}${m}</h2></div>${meta}</header>`;
}
let curSeed=1024;
const footHTML=(label)=>`<footer class="sh-foot"><span>さんすうプリント工房 ・ 小学${state.grade}年 算数</span><span>${label} ・ No.${curSeed}</span></footer>`;
const sheetHTML=(sections,head,label)=>`<section class="sheet">${head}<div class="sh-body">${sections}</div>${footHTML(label)}</section>`;
function secHTML(u,probs,ans,idx,pts){
  const cols=u.cols||1;
  const h=idx==null?`<p class="lead">${u.lead}</p>`:
    `<div class="sec-head"><span class="sec-no">${idx}</span><p class="lead">${u.lead}</p>${pts?`<span class="sec-pts">${pts}</span>`:''}</div>`;
  return `<div class="sec k-${u.kind}" data-uid="${u.id}${ans?'-a':''}">${h}<ol class="probs c${cols}">${probs.map((p,i)=>probHTML(u,p,i,ans)).join('')}</ol></div>`;
}
const TEST_N={calc:4,word:2,fig:2,table:1,data:1};
function render(){
  const ids=chaptersFor(state.grade).flatMap(c=>c.items.map(u=>u.id)).filter(id=>state.selected.has(id));
  const stack=$('#stack');
  if(!ids.length){stack.innerHTML=`<section class="sheet"><div class="sh-body" style="justify-content:center;align-items:center;color:#777;text-align:center">左の一覧から単元を選ぶと、ここにプリントが表示されます。</div></section>`;$('#count').textContent='0枚';fit();return}
  const sheets=[],answers=[];
  for(let k=0;k<state.sets;k++){
  curSeed=(state.seed+k-1)%99999+1;const sd=curSeed,tag=state.sets>1?`（${k+1}回目）`:'';
  if(state.mode==='unit'){
    ids.forEach(id=>{const u=unitOf(id);const probs=makeProblems(u,countFor(u),`${sd}:${id}`);curSeed=sd;
      if(state.explain&&k===0)sheets.push(explainSheet(u));curSeed=sd;
      sheets.push(sheetHTML(secHTML(u,probs,false),headHTML(u.chapter,u.title+tag,'',false),u.title));
      answers.push(sheetHTML(secHTML(u,probs,true),headHTML(u.chapter,u.title+tag,'ans',false),u.title))});
  }else{
    const us=ids.map(unitOf);
    const data=us.map(u=>({u,probs:makeProblems(u,TEST_N[u.kind]||2,`${sd}:test:${u.id}`)}));
    const total=data.reduce((s,d)=>s+d.probs.length,0);let used=0;
    const pts=data.map((d,i)=>{const p=i===data.length-1?100-used:Math.round(100*d.probs.length/total);used+=p;return p});
    const label=(i)=>{const each=pts[i]/data[i].probs.length;return Number.isInteger(each)?`1問 ${each}点`:`${pts[i]}点`};
    const title=(us.length===1?`${us[0].title} まとめテスト`:'まとめテスト')+tag;
    const chap=[...new Set(us.map(u=>u.chapter))].join('・');
    sheets.push(sheetHTML(data.map((d,i)=>secHTML(d.u,d.probs,false,i+1,label(i))).join(''),headHTML(chap,title,'',true),title));
    answers.push(sheetHTML(data.map((d,i)=>secHTML(d.u,d.probs,true,i+1,label(i))).join(''),headHTML(chap,title,'ans',false),title));
  }}
  curSeed=state.seed;
  const all=state.answers?sheets.concat(answers):sheets;
  stack.innerHTML=all.join('');
  liftSvgText(stack);
  paginate();
  $('#count').textContent=`A4 ${stack.querySelectorAll('.sheet').length}枚`;
  fit();
}
/* 図の文字を線より上に描く（白いふちどりと合わせて、線が重なっても読めるように） */
function liftSvgText(root){root.querySelectorAll('svg').forEach(svg=>{[...svg.children].filter(c=>c.tagName.toLowerCase()==='text').forEach(t=>svg.appendChild(t))});
  /* 文字が図の枠からはみ出すときは、枠（viewBox）を広げる */
  root.querySelectorAll('svg[viewBox]').forEach(svg=>{if(svg.ownerSVGElement)return;try{const vb=svg.viewBox.baseVal,bb=svg.getBBox();if(!vb||!vb.width||!bb.width)return;
    const x0=Math.min(vb.x,bb.x-1),y0=Math.min(vb.y,bb.y-1),x1=Math.max(vb.x+vb.width,bb.x+bb.width+1),y1=Math.max(vb.y+vb.height,bb.y+bb.height+1);
    if(x0<vb.x-.2||y0<vb.y-.2||x1>vb.x+vb.width+.2||y1>vb.y+vb.height+.2)svg.setAttribute('viewBox',`${num(x0)} ${num(y0)} ${num(x1-x0)} ${num(y1-y0)}`)}catch(e){}})}
/* A4 1枚に入りきらないときは、問題単位で次のページへ送る */
const A4H=297*96/25.4;
function paginate(){
  const MM=96/25.4,sheets=[...$('#stack').querySelectorAll('.sheet')];
  for(let i=0;i<sheets.length;i++){
    const sh=sheets[i];let next=null,guard=0;
    while(sh.scrollHeight>A4H+1&&guard++<60){
      const foot=sh.querySelector('.sh-foot'),limit=A4H-foot.offsetHeight-15*MM-2;
      const secs=[...sh.querySelectorAll('.sh-body>.sec')];if(!secs.length)break;
      let k=secs.findIndex(x=>x.offsetTop+x.offsetHeight>limit);if(k<0)k=secs.length-1;
      const sec=secs[k],lis=[...sec.querySelectorAll('.probs>.p')];
      let j=lis.findIndex(li=>li.offsetTop+li.offsetHeight>limit);
      if(j<0)j=lis.length-1;
      if(j===0&&k===0){if(lis.length<=1)break;j=1}
      if(!next){next=document.createElement('section');next.className='sheet';
        const head=sh.querySelector('.sh-head').cloneNode(true);const meta=head.querySelector('.sh-meta');if(meta)meta.replaceWith(document.createElement('div'));
        if(!head.querySelector('.cont'))head.querySelector('.sh-title').insertAdjacentHTML('beforeend','<span class="cont">（つづき）</span>');
        next.append(head);const b=document.createElement('div');b.className='sh-body';next.append(b,foot.cloneNode(true));
        sh.after(next);sheets.splice(i+1,0,next)}
      const nb=next.querySelector('.sh-body'),later=secs.slice(k+1);
      if(j===0){nb.prepend(sec,...later);continue}
      let tgt=nb.firstElementChild;
      if(!tgt||tgt.dataset.uid!==sec.dataset.uid||!tgt.dataset.clone){tgt=sec.cloneNode(true);tgt.dataset.clone='1';tgt.querySelector('.probs').innerHTML='';const lead=tgt.querySelector('.sec-head,.lead');if(lead)lead.remove();nb.prepend(tgt)}
      if(later.length)tgt.after(...later);
      tgt.querySelector('.probs').prepend(...lis.slice(j));
    }
  }
}
function fit(){
  const wrap=$('#stack-wrap'),stack=$('#stack');
  stack.style.transform='none';
  const w=wrap.clientWidth,sw=stack.offsetWidth;const s=Math.min(1,w/sw);
  stack.style.transform=s<1?`scale(${s})`:'none';
  wrap.style.height=s<1?`${stack.offsetHeight*s}px`:'auto';
}

/* ============ 操作 ============ */
try{const sv=JSON.parse(localStorage.getItem('sansu-print-sel')||'null');if(sv)for(const g in state.sel){if(Array.isArray(sv[g]))state.sel[g]=new Set(sv[g].filter(id=>UNIT_BY_ID[g+':'+id]))}}catch(e){}
buildUnitList();
document.querySelectorAll('.grades button').forEach((b,i)=>{b.disabled=false;b.removeAttribute('title');b.setAttribute('aria-pressed',String(i+1===state.grade));
  b.addEventListener('click',()=>{state.grade=i+1;document.querySelectorAll('.grades button').forEach((x,j)=>x.setAttribute('aria-pressed',String(j===i)));buildUnitList();render()})});
document.querySelectorAll('input[name="mode"]').forEach(r=>r.addEventListener('change',e=>{state.mode=e.target.value;
  $('#mode-hint').textContent=state.mode==='unit'?'選んだ単元を1枚ずつプリントにします。解説ページもつけられます。':'選んだ単元から数問ずつ集めて、1枚の100点テストにします（3〜5単元がおすすめ）。';render()}));
$('#amount').addEventListener('change',e=>{state.amount=+e.target.value;render()});
$('#sets').addEventListener('change',e=>{state.sets=+e.target.value;render()});
$('#with-explain').addEventListener('change',e=>{state.explain=e.target.checked;render()});
$('#with-answers').addEventListener('change',e=>{state.answers=e.target.checked;$('#with-steps').disabled=!e.target.checked;render()});
$('#with-steps').addEventListener('change',e=>{state.steps=e.target.checked;render()});
$('#with-name').addEventListener('change',e=>{state.name=e.target.checked;render()});
$('#seed').addEventListener('change',e=>{const v=Math.max(1,Math.min(99999,parseInt(e.target.value)||1));state.seed=v;e.target.value=v;render()});
$('#reroll').addEventListener('click',()=>{state.seed=1+Math.floor(Math.random()*99999);$('#seed').value=state.seed;render()});
const pb=$('#print');if(pb)pb.addEventListener('click',()=>window.print());
window.addEventListener('resize',fit);
window.addEventListener('beforeprint',()=>{$('#stack').style.transform='none';$('#stack-wrap').style.height='auto'});
window.addEventListener('afterprint',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
render();

</script>
