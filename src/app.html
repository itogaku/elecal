<title>さんすうプリント工房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 左に条件パネル、右にA4プリントの実寸プレビュー。紙は常に白、まわりの画面だけテーマに追従 */
:root{
  --bg:#eef1ec; --surface:#ffffff; --fg:#1f2a24; --muted:#5b6a61; --line:#d3dad4;
  --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#e1ece5; --red:#c8322a;
  --paper:#ffffff; --ink:#1b1b1b; --ink-soft:#555; --paper-line:#bdbdbd; --paper-tint:#eef4f0; --paper-red:#d2372b;
  --f-display:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131915; --surface:#1c241f; --fg:#e4ebe6; --muted:#9caaa1; --line:#2e3a33;
  --accent:#73b894; --accent-ink:#0e1a13; --accent-soft:#233229; --red:#ff7b6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131915; --surface:#1c241f; --fg:#e4ebe6; --muted:#9caaa1; --line:#2e3a33;
  --accent:#73b894; --accent-ink:#0e1a13; --accent-soft:#233229; --red:#ff7b6f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6;margin:0}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}

/* ---- panel ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width:860px){.panel{position:static}}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;letter-spacing:.02em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.field{display:flex;flex-direction:column;gap:8px}
.field>.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.grades button{font:inherit;padding:6px 0;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.grades button:hover{background:var(--accent-soft)}
.grades button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.grades button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chap.puzzle{border-top:1px dashed var(--line);padding-top:8px}
.chap-name .tag{font-weight:400}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:8px 6px;text-align:center;cursor:pointer;font-size:13px}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-3px}
.hint{font-size:12px;color:var(--muted);margin:0}
.units{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding-right:4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:10px}
@media (max-width:860px){.units{max-height:none}}
.chap>.chap-name{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chap-toggle{margin-left:auto;font:inherit;font-size:11px;font-weight:400;color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:999px;padding:1px 8px;cursor:pointer}
.chap-toggle:hover{background:var(--accent-soft)}
.unit-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sel-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.unit-tools{display:flex;flex-wrap:wrap;gap:6px}
.mini{font:inherit;font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.mini:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.mini:disabled{opacity:.45;cursor:default}
.mini.undo{border-color:var(--accent);color:var(--accent);font-weight:700}
.chap-toggle:focus-visible,.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grades button .gc{display:block;font-size:10px;line-height:1;opacity:.8;min-height:10px}
.unit{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:8px;cursor:pointer}
.unit:hover{background:var(--accent-soft)}
.unit input{margin-top:4px;accent-color:var(--accent)}
.unit .tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:4px;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type="number"]{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input[type="number"]{width:110px;font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.check input{accent-color:var(--accent)}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 14px;border:1px solid var(--accent);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-direction:column;gap:8px}
.note{font-size:12px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:0}

/* ---- preview ---- */
.preview{min-width:0;display:flex;flex-direction:column;gap:12px}
.preview-bar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.preview-bar h2{font-family:var(--f-display);font-size:16px;margin:0}
.preview-bar span{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.stack-wrap{min-width:0;overflow:hidden}
.stack{display:flex;flex-direction:column;gap:20px;width:210mm;transform-origin:top left}

/* ---- paper (A4) ---- */
.sheet{width:210mm;min-height:297mm;background:var(--paper);color:var(--ink);padding:13mm 14mm 11mm;display:flex;flex-direction:column;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);font-family:var(--f-body);font-size:11pt;line-height:1.5;position:relative}
.sh-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4mm;align-items:end;border-bottom:.6mm solid var(--ink);padding-bottom:3mm}
.sh-ch{display:inline-block;font-size:8.5pt;font-weight:700;border:.3mm solid var(--ink);border-radius:99px;padding:.2mm 3mm;margin-bottom:1.5mm}
.sh-title{font-family:var(--f-display);font-weight:700;font-size:19pt;margin:0;line-height:1.25;letter-spacing:.03em}
.sh-title .cont{font-size:11pt;font-weight:500;margin-left:2mm}
.sh-title .ans-mark{color:var(--paper-red);font-size:12pt;border:.4mm solid var(--paper-red);border-radius:2mm;padding:.3mm 2.4mm;margin-left:3mm;vertical-align:middle}
.sh-meta{display:flex;gap:2mm;font-size:9pt}
.sh-meta .box{border:.3mm solid var(--ink);border-radius:1.5mm;padding:1mm 2.5mm;min-height:11mm;display:flex;flex-direction:column;justify-content:space-between}
.sh-meta .box small{font-size:7.5pt;color:var(--ink-soft)}
.sh-meta .date{width:24mm}.sh-meta .name{width:46mm}.sh-meta .score{width:24mm;text-align:right}
.sh-meta .score b{font-size:8pt;font-weight:400}
.sh-body{flex:1;display:flex;flex-direction:column;gap:5mm;padding-top:4mm}
.sh-foot{display:flex;justify-content:space-between;font-size:7.5pt;color:var(--ink-soft);border-top:.2mm solid var(--paper-line);padding-top:1.5mm;margin-top:4mm;font-variant-numeric:tabular-nums}
.lead{margin:0;font-weight:700;font-size:10.5pt}
.sec{display:flex;flex-direction:column;gap:3mm;break-inside:avoid}
.sec-head{display:flex;align-items:center;gap:2.5mm}
.sec-no{display:inline-grid;place-items:center;width:7mm;height:7mm;background:var(--ink);color:var(--paper);border-radius:1.5mm;font-weight:700;font-size:11pt;flex:none}
.sec-pts{margin-left:auto;font-size:8.5pt;color:var(--ink-soft);white-space:nowrap}
.probs{list-style:none;margin:0;padding:0;display:grid;column-gap:8mm;row-gap:0}
.probs.c1{grid-template-columns:1fr}.probs.c2{grid-template-columns:1fr 1fr}.probs.c3{grid-template-columns:1fr 1fr 1fr}
.p{display:flex;gap:2mm;align-items:flex-start;break-inside:avoid;padding:2.4mm 0}
.p .no{font-size:9.5pt;flex:none;min-width:7mm;padding-top:.6mm;color:var(--ink-soft)}
.p .body{min-width:0;flex:1}
.k-calc .p{min-height:19mm;align-items:center;border-bottom:.2mm dotted var(--paper-line)}
.k-calc .p .no{padding-top:0}
.k-calc .q{font-size:13pt;display:inline-flex;align-items:center;flex-wrap:wrap;gap:.6mm}
.k-word .p,.k-table .p,.k-data .p{border-bottom:.2mm dotted var(--paper-line);padding-block:3mm}
.wq{font-size:10.5pt;line-height:1.75}
.answer-lines{display:flex;flex-direction:column;gap:2mm;margin-top:3mm}
.answer-lines .ln{display:flex;align-items:flex-end;gap:2mm;min-height:9mm}
.answer-lines .ln span{font-size:9pt;color:var(--ink-soft);white-space:nowrap}
.answer-lines .ln i{flex:1;border-bottom:.3mm solid var(--ink-soft)}
.answer-lines .ln.short{justify-content:flex-end}.answer-lines .ln.short i{flex:none;width:45mm}
.work{min-height:14mm}
.blank{display:inline-block;min-width:16mm;height:9mm;border:.35mm solid var(--ink);border-radius:1mm;vertical-align:middle;margin:0 1mm}
.frac .blank{min-width:7mm;height:6.5mm;margin:.4mm .6mm}
.frac .calc-ans{margin:0 .5mm}
.guide-q{display:flex;align-items:center;flex-wrap:wrap;gap:1.2mm;font-size:13pt;line-height:2}
.ans{color:var(--paper-red);font-weight:700}
.calc-ans{color:var(--paper-red);font-weight:700;margin-left:1.5mm;display:inline-flex;align-items:center;gap:1mm}
.alt{font-size:.8em;font-weight:400;display:inline-flex;align-items:center}
.ans-block{color:var(--paper-red);font-size:10pt;margin-top:2mm;line-height:1.8}
.ans-block b{font-weight:700}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:middle;line-height:1.12;margin:0 .1em;font-size:.9em}
.frac>.n{border-bottom:.3mm solid currentColor;padding:0 .18em}
.frac>.d{padding:0 .18em}
.mixed{display:inline-flex;align-items:center}
.var{font-family:"Times New Roman",Times,serif;font-size:1.12em;padding:0 .04em}
.k-fig .probs{row-gap:2mm}
.k-fig .p{flex-direction:column;align-items:stretch;gap:1mm;padding-block:2mm}
.k-fig .p .no{padding-top:0}
.fig svg{width:100%;height:auto;display:block}
/* 図が大きすぎて1枚に入る問題が少ない単元は、図を小さめにする */
.sec[data-uid^="g1-numline"] .fig,.sec[data-uid^="g3-decline"] .fig{max-width:125mm!important}
.sec[data-uid^="g2-ruler"] .fig{max-width:135mm!important}
.sec[data-uid^="enl-side"] .fig,.sec[data-uid^="g5-cong"] .fig,.sec[data-uid^="enl-grid"] .fig{max-width:112mm!important}
.sec[data-uid^="dotplot"] .fig{max-width:100mm!important}
.sec[data-uid^="g4-net"] .fig,.sec[data-uid^="enl-find"] .fig{max-width:140mm!important}
.sec[data-uid^="g4-fraceq"] .fig,.sec[data-uid^="x-pattern"] .fig{max-width:115mm!important}
.sec[data-uid^="approx-grid"] .fig,.sec[data-uid^="enl-center"] .fig,.sec[data-uid^="g4-cuboid"] .fig,.sec[data-uid^="g4-position"] .fig,.sec[data-uid^="sym-corr"] .fig{max-width:72mm!important;margin:0 auto}
.sec[data-uid^="g3-bar"] .fig,.sec[data-uid^="g4-line"] .fig{max-width:68mm!important;margin:0 auto}
.sec[data-uid^="graph-read"] .fig,.sec[data-uid^="g5-pie"] .fig{max-width:52mm!important;margin:0 auto}
.sec[data-uid^="prop-graph"] .fig,.sec[data-uid^="inv-graph"] .fig,.sec[data-uid^="comb-tree"] .fig{max-width:58mm!important;margin:0 auto}
.sec[data-uid^="g2-mulpic"] .fig{max-width:36mm!important}
/* 解答らんが3つ以上あるときは2列にして、たての長さを節約する */
.answer-lines:has(.ln:nth-child(3)){display:grid;grid-template-columns:1fr 1fr;column-gap:6mm}
.sheet svg text{paint-order:stroke fill;stroke:#fff;stroke-width:1px;stroke-linejoin:round}
.figcap{font-size:10pt}
.tbl{border-collapse:collapse;margin:2mm 0;font-variant-numeric:tabular-nums;font-size:10pt}
.tbl th,.tbl td{border:.3mm solid var(--ink);padding:1mm 2.4mm;text-align:center;min-width:11mm;height:8mm}
.tbl th{background:var(--paper-tint);font-weight:700;white-space:nowrap}
.tbl td.r{color:var(--paper-red);font-weight:700}
.datalist{border:.3mm solid var(--ink);border-radius:1.5mm;padding:2mm 3mm;margin:2mm 0;font-variant-numeric:tabular-nums;letter-spacing:.06em;display:flex;flex-wrap:wrap;gap:1mm 4mm}

/* 解き方・解説 */
.steps{list-style:none;margin:1.2mm 0 0;padding:0;display:flex;flex-direction:column;gap:.8mm;font-size:9pt;line-height:1.55;color:var(--ink-soft);font-weight:400}
.steps li{display:block;position:relative;padding-left:3mm}
.steps li::before{content:"";position:absolute;left:0;top:.62em;width:1.4mm;height:1.4mm;border-radius:50%;background:var(--paper-line)}
.k-calc .p.has-steps{align-items:flex-start}
.k-calc .p.has-steps .no{padding-top:1mm}
.sh-title .ex-mark{color:var(--ink);font-size:12pt;border:.4mm solid var(--ink);background:var(--paper-tint);border-radius:2mm;padding:.3mm 2.4mm;margin-left:3mm;vertical-align:middle}
.k-ex .probs{row-gap:4mm}
.k-ex .p{padding:0;display:block}
.ex-h{display:flex;align-items:center;gap:2mm;font-family:var(--f-display);font-weight:700;font-size:12pt;margin:0 0 2mm}
.ex-h .badge{background:var(--ink);color:var(--paper);border-radius:1.5mm;padding:.2mm 2.4mm;font-size:10pt}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.pt{background:var(--paper-tint);border-radius:2mm;padding:3mm 3.5mm;font-size:10pt;line-height:1.7}
.pt.wide{grid-column:1/-1}
.pt h3{margin:0 0 1mm;font-size:10.5pt;font-family:var(--f-display)}
.pt .exm{display:flex;align-items:center;flex-wrap:wrap;gap:1mm;margin-top:1.5mm;font-size:11pt}
.ex{border:.3mm solid var(--ink);border-radius:2mm;padding:3mm 4mm}
.exq{display:flex;align-items:center;flex-wrap:wrap;gap:1mm;font-size:12pt}
.ex .exq.text{font-size:10.5pt;display:block;line-height:1.75}
.ex .kangae{display:inline-block;margin-top:2.5mm;font-size:9pt;font-weight:700;border-bottom:.3mm solid var(--ink)}
.ex .steps{font-size:10pt;color:var(--ink)}
.ex .steps li::before{background:var(--ink)}
.ex .exa{margin-top:2mm;font-weight:700;display:flex;align-items:center;gap:1.5mm;flex-wrap:wrap}
.ex .exa .ans{display:inline-flex;align-items:center;gap:1mm}
.ex-fig{display:grid;grid-template-columns:1fr 1fr;gap:4mm;align-items:start}
.ex-fig .fig{max-width:62mm}
.figlabel{font-size:8.5pt;color:var(--ink-soft)}
.why{border:.4mm solid #2a6fb0;border-radius:2mm;padding:3mm 4mm;background:#f6faff}
.why-b{background:#2a6fb0!important}
.why-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:4mm;align-items:center}
.why-grid.nofig{grid-template-columns:1fr}
.why-grid .fig svg{max-height:52mm}
.why-steps{margin:0;padding-left:5mm;font-size:10pt;line-height:1.75;display:flex;flex-direction:column;gap:1mm}
.why-steps li::marker{color:#2a6fb0;font-weight:700}
.tip{border:.3mm dashed var(--ink-soft);border-radius:2mm;padding:2.5mm 3.5mm;font-size:10pt;line-height:1.7}
.tip b{font-family:var(--f-display)}
.utbl{border-collapse:collapse;font-size:9.5pt;margin-top:1.5mm}
.utbl td{border:.25mm solid var(--paper-line);padding:.6mm 2.4mm;background:var(--paper)}

@media (prefers-reduced-motion:no-preference){.sheet{transition:opacity .15s}}

@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .panel,.preview-bar{display:none!important}
  .app{display:block;padding:0;max-width:none}
  .stack-wrap{overflow:visible;height:auto!important}
  .stack{transform:none!important;gap:0;width:auto}
  .sheet{box-shadow:none;margin:0;break-after:page;width:210mm;min-height:297mm;height:297mm;overflow:hidden}
  .sheet:last-child{break-after:auto}
}
</style>

<div class="app">
  <aside class="panel" aria-label="プリントの条件">
    <div class="brand">
      <h1>さんすうプリント工房</h1>
      <p>小学1〜6年の算数と脳トレパズル。単元を選ぶと、数値がちがうプリントを何枚でも作れます。</p>
    </div>

    <div class="field">
      <span class="label">学年</span>
      <div class="grades" role="group" aria-label="学年">
        <button type="button" disabled title="準備中">1年</button>
        <button type="button" disabled title="準備中">2年</button>
        <button type="button" disabled title="準備中">3年</button>
        <button type="button" disabled title="準備中">4年</button>
        <button type="button" disabled title="準備中">5年</button>
        <button type="button" aria-pressed="true">6年</button>
      </div>
    </div>

    <div class="field">
      <span class="label">作り方</span>
      <div class="seg">
        <input type="radio" name="mode" id="mode-unit" value="unit" checked><label for="mode-unit">単元ごと</label>
        <input type="radio" name="mode" id="mode-test" value="test"><label for="mode-test">まとめテスト</label>
      </div>
      <p class="hint" id="mode-hint">選んだ単元を1枚ずつプリントにします。</p>
    </div>

    <div class="field">
      <div class="unit-head"><span class="label">単元</span><span class="sel-count" id="sel-count" aria-live="polite"></span></div>
      <div class="unit-tools">
        <button type="button" class="mini" id="clear-grade">この学年の選択をリセット</button>
        <button type="button" class="mini" id="clear-all">全学年をリセット</button>
        <button type="button" class="mini undo" id="undo-reset" hidden>元に戻す</button>
      </div>
      <div class="units" id="units"></div>
    </div>

    <div class="field">
      <span class="label">オプション</span>
      <div class="row">
        <label for="amount">問題の量</label>
        <select id="amount">
          <option value="0.5">少なめ（半分）</option>
          <option value="1">1枚分</option>
          <option value="2" selected>2枚分</option>
          <option value="3">3枚分</option>
          <option value="5">5枚分</option>
        </select>
      </div>
      <p class="hint">1単元あたりの量です。図の問題もこの量だけふえます。</p>
      <div class="row">
        <label for="sets">セット数</label>
        <select id="sets">
          <option value="1" selected>1セット</option>
          <option value="2">2セット</option>
          <option value="3">3セット</option>
          <option value="5">5セット</option>
          <option value="10">10セット</option>
        </select>
      </div>
      <p class="hint">数字のちがうプリントを、まとめて何回分も作れます（問題番号が1つずつずれます）。</p>
      <label class="check"><input type="checkbox" id="with-explain" checked> 解説ページをつける（ポイントと例題）</label>
      <label class="check"><input type="checkbox" id="with-answers" checked> 答えのページをつける</label>
      <label class="check"><input type="checkbox" id="with-steps" checked> 答えに解き方をのせる</label>
      <label class="check"><input type="checkbox" id="with-name" checked> 日付・名前の欄をつける</label>
      <div class="row">
        <label for="seed">問題番号</label>
        <input type="number" id="seed" min="1" max="99999" value="1024">
      </div>
